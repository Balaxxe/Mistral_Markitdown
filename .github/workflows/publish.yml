name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run format check
        run: |
          python -m black --check .
          python -m isort --check-only .

      - name: Run lint
        run: python -m flake8 .

      - name: Run typecheck
        run: python -m pyright

      - name: Run tests
        run: python -m pytest tests/ -v --cov=. --cov-fail-under=75

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Verify tag matches pyproject version
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          try:
              import tomllib
          except ImportError:  # Python < 3.11
              tomllib = None

          ref = os.environ["GIT_REF"]
          prefix = "refs/tags/"
          if not ref.startswith(prefix):
              sys.exit(f"Publish must run on a tag push, got {ref}")
          tag = ref[len(prefix):]
          if tomllib is not None:
              with open("pyproject.toml", "rb") as handle:
                  version = tomllib.load(handle)["project"]["version"]
          else:
              with open("pyproject.toml", "r", encoding="utf-8") as handle:
                  text = handle.read()
              project = re.search(r"^\[project\]\s*$(.*?)(?=^\[|\Z)", text, re.MULTILINE | re.DOTALL)
              if project is None:
                  sys.exit("pyproject.toml has no [project] table")
              found = re.search(r'^version\s*=\s*"([^"]+)"\s*$', project.group(1), re.MULTILINE)
              if found is None:
                  sys.exit("pyproject.toml has no [project] version")
              version = found.group(1)
          if f"v{version}" != tag:
              sys.exit(f"Tag {tag} does not match pyproject version {version} (expected v{version})")
          print(f"Tag {tag} matches pyproject version {version}")
          PY

      - name: Install build tools
        run: pip install build

      - name: Build distribution
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
